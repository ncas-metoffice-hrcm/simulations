name: Create simulation YAML template

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate blank simulation YAML
        run: python scripts/create_simulation_template.py

      - name: Commit and push generated template
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- simulation_id.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Create or refresh simulation_id.yml template"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
          
